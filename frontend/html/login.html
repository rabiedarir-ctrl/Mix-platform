
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b65d8">

  <title>تسجيل الدخول | Mix Platform</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071d3b, #0b65d8);
      color: #172b4d;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, .2);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #0865d5;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .logo p {
      margin-top: 8px;
      color: #718096;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 23px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9e2ef;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border .2s, box-shadow .2s;
      background: #fbfdff;
    }

    input:focus {
      border-color: #0865d5;
      box-shadow: 0 0 0 3px rgba(8, 101, 213, .1);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-left: 65px;
    }

    .show-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #0865d5;
      cursor: pointer;
      font-size: 13px;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 8px;
      background: #0865d5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s;
    }

    .submit-btn:hover {
      background: #064da5;
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .message.error {
      display: block;
      color: #a61b1b;
      background: #fff0f0;
      border: 1px solid #ffd0d0;
    }

    .message.success {
      display: block;
      color: #176b3a;
      background: #edfff3;
      border: 1px solid #c4f0d2;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      line-height: 2;
    }

    .links a {
      color: #0865d5;
      text-decoration: none;
      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #8a98a9;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 27px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">
      <h1>Mix Platform</h1>
      <p>عالمك الرقمي في مكان واحد</p>
    </div>

    <h2>تسجيل الدخول</h2>

    <form id="loginForm" autocomplete="on">

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>

        <div class="password-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="togglePassword"
          >إظهار</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="loginButton">
        دخول إلى حسابي
      </button>

      <div id="message" class="message" role="alert"></div>

    </form>

    <div class="links">
      <p>ليس لديك حساب؟
        <a href="register.html">إنشاء حساب جديد</a>
      </p>
      <p>
        <a href="../index.html">العودة إلى الرئيسية</a>
      </p>
    </div>

    <div class="footer">
      © 2026 Mix Platform — جميع الحقوق محفوظة
    </div>

  </main>

  <script>
    "use strict";

    const API_BASE = window.MIX_API_BASE || "/api";
    const LOGIN_URL = `${API_BASE}/users/login`;

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    togglePassword.addEventListener("click", () => {
      const hidden = passwordInput.type === "password";

      passwordInput.type = hidden ? "text" : "password";
      togglePassword.textContent = hidden ? "إخفاء" : "إظهار";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "جارٍ تسجيل الدخول...";
      message.className = "message";

      try {
        const response = await fetch(LOGIN_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "تعذر تسجيل الدخول. تحقق من بياناتك."
          );
        }

        const token =
          data.token ||
          data.accessToken ||
          data.access_token;

        const user =
          data.user ||
          data.data?.user ||
          data.data ||
          null;

        if (!token) {
          throw new Error(
            "استجابة الخادم لا تحتوي على رمز الدخول. تحقق من API."
          );
        }

        localStorage.setItem("mixToken", token);

        if (user) {
          localStorage.setItem("currentUser", JSON.stringify(user));
        }

        showMessage("تم تسجيل الدخول بنجاح. جارٍ تحويلك...", "success");

        window.location.href = "../index.html";

      } catch (error) {
        showMessage(
          error.message ||
          "حدث خطأ أثناء الاتصال بالخادم."
        );
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "دخول إلى حسابي";
      }
    });
  </script>

</body>
    </html>
