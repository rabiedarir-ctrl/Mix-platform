<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071d3b">
  <title>تسجيل الدخول - Mix Platform</title>
  <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
  <main class="login-card">
    <header class="logo">
      <h1>Mix Platform</h1>
      <p>مرحباً بعودتك إلى عالم Mix</p>
    </header>

    <h2>تسجيل الدخول</h2>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="identifier">البريد الإلكتروني أو اسم المستخدم</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username"
          placeholder="أدخل بريدك الإلكتروني أو اسم المستخدم" required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
          placeholder="أدخل كلمة المرور" required>
      </div>

      <p id="feedback" class="message" role="alert" aria-live="polite" hidden></p>
      <button id="submitBtn" class="submit-btn" type="submit">تسجيل الدخول</button>
    </form>

    <nav class="links" aria-label="روابط الحساب">
      <span>ليس لديك حساب؟</span>
      <a href="register.html">إنشاء حساب جديد</a>
    </nav>
  </main>

  <footer>© Mix Platform</footer>

  <script src="../static/pages/api.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const feedback = document.getElementById("feedback");
    const submitBtn = document.getElementById("submitBtn");

    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = `message ${type}`;
      feedback.hidden = false;
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      feedback.hidden = true;

      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;
      if (!identifier || !password) {
        showFeedback("يرجى إدخال البريد الإلكتروني أو اسم المستخدم وكلمة المرور.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "جارٍ تسجيل الدخول...";

      try {
        const result = await window.AuthAPI.login(identifier, password);
        if (!result || !result.token) {
          throw new Error(result?.message || result?.error || "لم يتم إرجاع رمز تسجيل الدخول من الخادم.");
        }
        localStorage.setItem("mixToken", result.token);
        if (result.user) localStorage.setItem("mixUser", JSON.stringify(result.user));
        window.location.href = "dashboard.html";
      } catch (error) {
        showFeedback(error.message || "تعذر تسجيل الدخول. تحقق من بياناتك وحاول مجدداً.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
