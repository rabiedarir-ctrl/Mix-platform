<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="التغذية الاجتماعية في منصة Mix Platform - شارك وتفاعل مع المستخدمين">
    <title>التغذية - Mix Platform</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        .error-message {
            color: #e74c3c;
            padding: 12px;
            background-color: #fadbd8;
            border-radius: 4px;
            margin: 12px 0;
        }
        .success-message {
            color: #27ae60;
            padding: 12px;
            background-color: #d5f4e6;
            border-radius: 4px;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>التغذية الاجتماعية</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">لوحة التحكم</a></li>
                <li><a href="messages.html">الرسائل</a></li>
                <li><a href="games.html">الألعاب</a></li>
                <li><a href="dream_world.html">عالم الأحلام</a></li>
                <li><button id="logoutBtn" type="button">تسجيل الخروج</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="new-post-section">
            <h2>إنشاء منشور جديد</h2>
            <form id="postForm" novalidate>
                <div class="form-group">
                    <label for="postContent">محتوى المنشور</label>
                    <textarea 
                        id="postContent" 
                        placeholder="اكتب شيئًا..." 
                        required
                        maxlength="1000"
                        aria-required="true"
                        aria-describedby="postContent-error"></textarea>
                    <small id="charCount">0 / 1000</small>
                    <span id="postContent-error" class="error-message" role="alert"></span>
                </div>
                <button type="submit" id="postSubmitBtn">نشر</button>
            </form>
            <div id="postFeedback" role="alert" aria-live="polite"></div>
        </section>

        <section class="posts-section">
            <h2>المنشورات</h2>
            <div id="postsContainer">
                <p>جارٍ تحميل المنشورات...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Mix Platform. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="../static/api.js"></script>
    <script>
        const token = localStorage.getItem("mixToken");
        if (!token) {
            window.location.href = "login.html";
        }

        const postsContainer = document.getElementById("postsContainer");
        const postForm = document.getElementById("postForm");
        const postFeedback = document.getElementById("postFeedback");
        const postContent = document.getElementById("postContent");
        const postSubmitBtn = document.getElementById("postSubmitBtn");
        const charCount = document.getElementById("charCount");
        const logoutBtn = document.getElementById("logoutBtn");

        // عداد الأحرف
        postContent.addEventListener('input', () => {
            charCount.textContent = `${postContent.value.length} / 1000`;
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem("mixToken");
            window.location.href = "login.html";
        });

        // تحميل المنشورات
        async function loadPosts() {
            try {
                const res = await fetch(`${MIX_API_BASE}/social/posts`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();

                if (res.ok) {
                    postsContainer.innerHTML = '';
                    if (Array.isArray(data) && data.length === 0) {
                        postsContainer.innerHTML = '<p>لا توجد منشورات بعد.</p>';
                    } else if (Array.isArray(data)) {
                        data.forEach(post => {
                            const div = document.createElement('div');
                            div.className = 'post-card';
                            const postDate = new Date(post.createdAt).toLocaleString('ar-SA');
                            div.innerHTML = `
                                <div class="post-header">
                                    <strong>${escapeHtml(post.user)}</strong>
                                    <time>${postDate}</time>
                                </div>
                                <p>${escapeHtml(post.content)}</p>
                                <div class="post-stats">
                                    <span>💬 ${post.comments ? post.comments.length : 0}</span>
                                    <span>👍 ${post.likes || 0}</span>
                                </div>
                            `;
                            postsContainer.appendChild(div);
                        });
                    } else {
                        postsContainer.innerHTML = '<p>خطأ في تنسيق البيانات</p>';
                    }
                } else {
                    postsContainer.innerHTML = `<p class="error-message">خطأ في تحميل المنشورات: ${data.message}</p>`;
                }
            } catch (err) {
                postsContainer.innerHTML = '<p class="error-message">تعذر الاتصال بالخادم. تحقق من اتصالك بالإنترنت.</p>';
                console.error(err);
            }
        }

        // دالة آمنة لتحويل نص إلى HTML آمن
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // إنشاء منشور جديد
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            postFeedback.innerHTML = '';
            const content = postContent.value.trim();

            if (!content) {
                postFeedback.innerHTML = '<div class="error-message">الرجاء كتابة محتوى المنشور</div>';
                return;
            }

            if (content.length > 1000) {
                postFeedback.innerHTML = '<div class="error-message">محتوى المنشور طويل جداً (أقصى 1000 حرف)</div>';
                return;
            }

            postSubmitBtn.disabled = true;
            postSubmitBtn.textContent = 'جاري النشر...';

            try {
                const res = await fetch(`${MIX_API_BASE}/social/posts`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ content })
                });

                const data = await res.json();
                if (res.ok) {
                    postContent.value = '';
                    charCount.textContent = '0 / 1000';
                    postFeedback.innerHTML = '<div class="success-message">تم نشر المنشور بنجاح!</div>';
                    loadPosts();
                } else {
                    postFeedback.innerHTML = `<div class="error-message">${data.message || "خطأ في النشر"}</div>`;
                }
            } catch (err) {
                postFeedback.innerHTML = '<div class="error-message">تعذر الاتصال بالخادم</div>';
                console.error(err);
            } finally {
                postSubmitBtn.disabled = false;
                postSubmitBtn.textContent = 'نشر';
            }
        });

        // تحميل المنشورات عند فتح الصفحة
        loadPosts();
    </script>
</body>
</html>
