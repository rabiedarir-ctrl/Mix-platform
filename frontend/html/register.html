<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="صفحة تسجيل الدخول إلى منصة Mix Platform - عالم افتراضي تفاعلي" />
    <title>تسجيل الدخول - Mix Platform</title>
    <link rel="stylesheet" href="../../static/style.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }
        .login-section {
            max-width: 420px;
            margin: 80px auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            color: white;
        }
        .login-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
        }
        input::placeholder {
            color: rgba(255,255,255,0.75);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #4f46e5;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .feedback {
            margin-top: 16px;
            min-height: 24px;
        }
        .error-message, .success-message {
            display: block;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            margin-top: 10px;
        }
        .error-message {
            background: rgba(255, 99, 99, 0.15);
            color: #fff;
            border-left: 4px solid #ff5e5e;
        }
        .success-message {
            background: rgba(76, 201, 91, 0.15);
            color: white;
            border-left: 4px solid #55d66b;
        }
        .register-link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
        .register-link a {
            color: white;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <section class="login-section">
        <h2>تسجيل الدخول</h2>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" id="email" name="email" placeholder="أدخل البريد أو اسم المستخدم" />
                <span id="email-error" class="error-message" style="display:none;"></span>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" />
                <span id="password-error" class="error-message" style="display:none;"></span>
            </div>

            <button id="loginBtn" type="submit">تسجيل الدخول</button>
        </form>

        <div id="feedback" class="feedback"></div>

        <div class="register-link">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </section>

    <script src="../../static/pages/api.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const emailError = document.getElementById("email-error");
        const passwordError = document.getElementById("password-error");
        const feedback = document.getElementById("feedback");

        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("mixToken");
            if (token) {
                window.location.href = "dashboard.html";
            }
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            emailError.style.display = "none";
            emailError.textContent = "";
            passwordError.style.display = "none";
            passwordError.textContent = "";
            feedback.innerHTML = "";

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let valid = true;

            if (!email) {
                emailError.textContent = "البريد أو اسم المستخدم مطلوب";
                emailError.style.display = "block";
                valid = false;
            }

            if (!password) {
                passwordError.textContent = "كلمة المرور مطلوبة";
                passwordError.style.display = "block";
                valid = false;
            }

            if (!valid) return;

            loginBtn.disabled = true;
            loginBtn.textContent = "جاري الدخول...";

            try {
                const response = await AuthAPI.login(email, password);

                if (!response || !response.token) {
                    throw new Error("لم يتم استلام توكن من الخادم");
                }

                localStorage.setItem("mixToken", response.token);

                if (response.user) {
                    localStorage.setItem("currentUser", JSON.stringify(response.user));
                }

                feedback.innerHTML = '<div class="success-message">✅ تم تسجيل الدخول بنجاح</div>';

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 700);
            } catch (error) {
                let msg = "❌ حدث خطأ أثناء تسجيل الدخول";
                if (error.status === 401) {
                    msg = "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة";
                } else if (error.status === 403) {
                    msg = "❌ هذا الحساب غير نشط";
                } else if (error.status === 429) {
                    msg = "❌ عدد محاولات كثيرة، حاول لاحقاً";
                } else if (error.message) {
                    msg = `❌ ${error.message}`;
                }

                feedback.innerHTML = `<div class="error-message">${msg}</div>`;
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "تسجيل الدخول";
            }
        });
    </script>
</body>
</html>
