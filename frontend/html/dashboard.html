<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب جديد - Mix Platform</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
    }
    .register-section {
      max-width: 520px;
      margin: 60px auto;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
      padding: 30px;
      color: white;
    }
    .register-section h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #4f46e5;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .feedback {
      margin-top: 16px;
      min-height: 22px;
    }
    .error-message, .success-message {
      display: block;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      margin-top: 10px;
    }
    .error-message {
      background: rgba(255, 99, 99, 0.15);
      color: white;
      border-left: 4px solid #ff5e5e;
    }
    .success-message {
      background: rgba(76, 201, 91, 0.15);
      color: white;
      border-left: 4px solid #55d66b;
    }
    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }
    .login-link a {
      color: white;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <section class="register-section">
    <h2>إنشاء حساب جديد</h2>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" />
      </div>

      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" placeholder="اختر اسم مستخدم" />
      </div>

      <div class="form-group">
        <label for="fullname">الاسم الكامل</label>
        <input type="text" id="fullname" name="fullname" placeholder="أدخل الاسم الكامل" />
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="أعد إدخال كلمة المرور" />
      </div>

      <div class="form-group">
        <label for="phone">رقم الهاتف (اختياري)</label>
        <input type="tel" id="phone" name="phone" placeholder="أدخل رقم الهاتف" />
      </div>

      <div class="terms-checkbox" style="display:flex; align-items:center; gap:10px; margin-top:10px;">
        <input type="checkbox" id="terms" />
        <label for="terms" style="margin:0;">أوافق على الشروط</label>
      </div>

      <button id="submitBtn" type="submit">إنشاء حسابي</button>
    </form>

    <div id="feedback" class="feedback"></div>

    <div class="login-link">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>
  </section>

  <script src="../../static/pages/api.js"></script>
  <script>
    const registerForm = document.getElementById("registerForm");
    const feedback = document.getElementById("feedback");
    const submitBtn = document.getElementById("submitBtn");

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      feedback.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const fullname = document.getElementById("fullname").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const phone = document.getElementById("phone").value.trim();
      const termsAccepted = document.getElementById("terms").checked;

      if (!email || !username || !fullname || !password || !confirmPassword) {
        feedback.innerHTML = '<div class="error-message">❌ يرجى ملء جميع الحقول الأساسية</div>';
        return;
      }

      if (password.length < 8) {
        feedback.innerHTML = '<div class="error-message">❌ كلمة المرور يجب أن لا تقل عن 8 أحرف</div>';
        return;
      }

      if (password !== confirmPassword) {
        feedback.innerHTML = '<div class="error-message">❌ كلمة المرور وتأكيدها غير متطابقين</div>';
        return;
      }

      if (!termsAccepted) {
        feedback.innerHTML = '<div class="error-message">❌ يجب الموافقة على الشروط</div>';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري الإنشاء...";

      try {
        const response = await fetch(`${window.MIX_API_BASE}/users/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            username,
            fullname,
            password,
            confirmPassword,
            phone: phone || "",
            termsAccepted: true
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "فشل في إنشاء الحساب");
        }

        feedback.innerHTML = '<div class="success-message">✅ تم إنشاء الحساب بنجاح</div>';

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1000);

      } catch (error) {
        feedback.innerHTML = `<div class="error-message">❌ ${error.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "إنشاء حسابي";
      }
    });
  </script>
</body>
</html>
